name: Build DCP Civic Reg APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Install Capacitor
        run: npm install --no-save @capacitor/cli@8 @capacitor/core@8 @capacitor/android@8

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate and rename APK
        working-directory: android
        run: |
          APK_PATH=
          if [ -z "" ]; then
            echo "ERROR: No APK was generated"
            find app/build/outputs -type f -print || true
            exit 1
          fi
          echo "Found APK: "
          cp "" ../DCP-Civic-Reg.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DCP-Civic-Reg
          path: DCP-Civic-Reg.apk
          if-no-files-found: error

